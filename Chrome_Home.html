<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YeĦ.btc仪表盘</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&display=swap">
<style>
:root{--ink:#1d1d1f;--mute:#6e6e73;--line:rgba(0,0,0,.1);--pane:255,255,255;--pa:.5;--accent:#0a84ff;--up:#1a9d55;--dn:#e5484d;--red:#e5484d;--green:#1a9d55;--shade:0;--fallback:#e9e6df;color-scheme:light}
:root[data-theme="dark"]{--ink:#f5f5f7;--mute:#a1a1a6;--line:rgba(255,255,255,.14);--pane:30,30,32;--pa:.45;--accent:#64d2ff;--up:#32d583;--dn:#ff6369;--red:#ff6369;--green:#32d583;--shade:.3;--fallback:#141519;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:400 14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;background:var(--fallback);-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:-30px;z-index:-2;background:center/cover no-repeat}
#shade{position:fixed;inset:0;z-index:-1;background:#000;opacity:var(--shade)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.up{color:var(--up)}.dn{color:var(--dn)}.rd{color:var(--red)}.gn{color:var(--green)}

/* menu bar */
.menubar{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;min-height:92px;padding:10px 24px;background:rgba(var(--pane),calc(var(--pa) + .2));backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);border-bottom:1px solid var(--line)}
.who{display:flex;align-items:center;gap:14px;font-weight:700;font-size:clamp(18px,1.7vw,32px);white-space:nowrap}
.who img{width:clamp(40px,3.6vw,68px);height:clamp(40px,3.6vw,68px);border-radius:50%;object-fit:cover;box-shadow:0 0 0 1.5px var(--line)}
.who span span{font-weight:400;color:var(--mute);margin-left:10px;font-size:.6em}
#motto{font-size:clamp(16px,1.5vw,28px);font-weight:600;text-align:center;padding:4px 14px;border-radius:8px;outline:none;max-width:38vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#motto:hover,#motto:focus{background:rgba(var(--pane),.5)}
.sys{display:flex;justify-content:flex-end;align-items:center;gap:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tm{text-align:right}
.tm b{display:block;font-weight:600;font-size:clamp(20px,1.7vw,32px);line-height:1.15}
.dl{white-space:normal;color:var(--mute);font-size:clamp(12px,1.05vw,20px);display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.fest{padding:0 10px;border-radius:20px;font-size:.85em;background:rgba(229,72,77,.14);color:var(--red);font-weight:600}
.fest.work{background:rgba(255,159,10,.18);color:#d98200}
.fest:empty{display:none}
.cal .c1{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
.cal #dt{font-size:24px;font-weight:600}
.cal #lunar{font-size:20px;color:var(--mute)}
.cal .c2{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:12px;font-size:14px}
.cal .fest{font-size:14px;padding:2px 12px}
.cal #nxt{color:var(--mute)}
.qt{font-size:19px;line-height:1.7;font-weight:500}
.qf{color:var(--mute);text-align:right;margin-top:8px;font-size:13px}
.btn{border:1px solid var(--line);background:rgba(var(--pane),.55);border-radius:7px;padding:2px 10px;font-size:12px;line-height:1.7}
.btn:hover,.btn.on{border-color:var(--accent);color:var(--accent)}
.btn.on{background:rgba(10,132,255,.12)}

/* windows */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin:20px 24px 80px;align-items:start}
.win{background:rgba(var(--pane),var(--pa));backdrop-filter:blur(28px) saturate(1.7);-webkit-backdrop-filter:blur(28px) saturate(1.7);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.08);overflow:hidden}
.tb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:38px;padding:0 14px;border-bottom:1px solid var(--line)}
.tt{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap}
.ta{display:flex;justify-content:flex-end;gap:6px}
.chip{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:20px;padding:0 9px}
.wb{padding:18px 20px}
.collapsed .wb{display:none}
@media(max-width:1000px){.cols{grid-template-columns:1fr}.menubar{grid-template-columns:1fr auto;height:auto;padding:8px 14px}#motto{grid-row:2;grid-column:1/-1;max-width:100%}}

/* bookmarks */
.bmcols{display:grid;grid-template-columns:1fr 1fr}
.bmcols>div:first-child{padding-right:20px;border-right:1px solid var(--line)}
.bmcols>div:last-child{padding-left:20px}
@media(max-width:560px){.bmcols{grid-template-columns:1fr}.bmcols>div:first-child{padding:0;border:0}.bmcols>div:last-child{padding:0}}
.grp{margin-bottom:26px}
.gh{display:flex;gap:10px;align-items:center;font-size:13px;margin-bottom:14px}
.gh .t{color:var(--mute);font-weight:600}
.gh::after{content:"";flex:1;height:1px;background:var(--line);order:1}
.gh button{order:2;border:0;background:none;color:var(--accent);padding:0 2px;font-size:12px;display:none}
.edit .gh button{display:inline}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:18px 6px}
.it{position:relative}
.it a{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink);text-decoration:none;font-size:12px}
.ic{width:72px;height:72px;border-radius:22.4%;display:grid;place-items:center;overflow:hidden;color:#fff;font-size:30px;font-weight:600;transition:transform .15s}
.it a:hover .ic{transform:scale(1.08)}
.ic img{width:86%;height:86%;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.it .n{max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .x{position:absolute;top:-6px;left:2px;width:24px;height:24px;border:0;border-radius:50%;background:#8e8e93;color:#fff;display:none;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.edit .it .x{display:block}
.addi{width:72px;height:72px;border:2px dashed var(--line);background:none;border-radius:22.4%;color:var(--mute);font-size:26px;display:none;justify-self:center}
.edit .addi{display:block}

/* right column */
.rcol{display:flex;flex-direction:column;gap:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
.spot{display:flex;align-items:center;gap:12px;padding:6px 8px 6px 18px}
.spot b{font-size:17px;letter-spacing:-.5px}
.spot b span:nth-child(1),.spot b span:nth-child(4){color:#4285f4}.spot b span:nth-child(2),.spot b span:nth-child(6){color:#ea4335}.spot b span:nth-child(3){color:#fbbc05}.spot b span:nth-child(5){color:#34a853}
.spot input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:17px;padding:12px 10px}
.spot input::placeholder{color:var(--mute)}
.spot input:focus{outline:none}
.badge{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.main{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.px{font:600 clamp(30px,3.4vw,46px)/1.05 ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:-1.5px;transition:color .3s}
.chg{text-align:right}
.chg b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.chg small{color:var(--mute);font-size:12px}
.quote-time{margin-top:9px;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.quote-time.stale{color:var(--dn)}
.fr{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding:10px 14px;border-radius:10px;background:rgba(var(--pane),.35);border:1px solid var(--line)}
.fr span{color:var(--mute);font-size:12px}.fr small{margin-left:8px;opacity:.8}
.fr b{font:600 17px ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.blk+.blk{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.blk h3{margin:0 0 8px;font-size:13px;font-weight:600;display:flex;justify-content:space-between}
.big{font:600 20px/1 ui-monospace,Menlo,Consolas,monospace}
.row{margin-bottom:10px}
.rl{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:4px}
.rt{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--mute)}
.bar{display:flex;height:8px;border-radius:5px;overflow:hidden;background:var(--line);margin-top:6px}
.bar i{display:block;background:var(--up);transition:width .4s}.bar i+i{background:var(--dn)}
.bar.rev i{background:var(--dn)}.bar.rev i+i{background:var(--up)}
.fg{text-align:center}
.fg svg{width:100%;max-width:240px;display:block;margin:0 auto;color:var(--ink)}
.fg .num{font:600 44px/1 ui-monospace,Menlo,Consolas,monospace;margin-top:-6px}
.fg .cls{font-size:16px;font-weight:600;margin-top:4px}
.fg small{color:var(--mute)}
.lt{font:600 34px/1.1 ui-monospace,Menlo,Consolas,monospace;margin:4px 0 12px}
.note{font-size:11px;color:var(--mute);margin:12px 0 0}

.duo{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:stretch}
@media(max-width:700px){.duo{grid-template-columns:1fr}}
.lcol{display:grid;grid-template-rows:1fr 1fr;gap:18px}
.eq{display:flex;flex-direction:column;min-height:250px}
.eq .tb{height:36px}
.eq .wb{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px 26px;position:relative}
.eq .cal .c1{display:flex;flex-direction:column;align-items:center;gap:4px}
.eq .cal #dt{font-size:clamp(30px,3vw,44px);font-weight:700;line-height:1.15;letter-spacing:-.5px}
.eq .cal #lunar{font-family:"Ma Shan Zheng","Zhi Mang Xing","STXingkai","Xingkai SC","KaiTi","STKaiti",cursive;font-size:clamp(26px,2.4vw,36px);font-weight:400;color:var(--ink)}
.eq .cal .c2{display:flex;justify-content:center;flex-wrap:wrap;gap:10px 16px;margin-top:16px;font-size:17px}
.eq .cal .fest{font-size:17px;padding:2px 16px}
.eq .cal #nxt{font-size:17px;color:var(--mute)}
.eq .qt{font-family:"Ma Shan Zheng","Zhi Mang Xing","STXingkai","Xingkai SC","KaiTi","STKaiti",cursive;font-size:36px;line-height:1.55;font-weight:400;letter-spacing:.04em;max-height:none;overflow:visible;background:linear-gradient(120deg,var(--ink) 35%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.eq .qf{font-family:"Ma Shan Zheng","Zhi Mang Xing","STXingkai","Xingkai SC","KaiTi","STKaiti",cursive;font-size:20px;margin-top:14px;color:var(--mute);text-align:center}
.quote .wb::before{content:"\201C";position:absolute;left:16px;top:-4px;font:110px/1 Georgia,serif;color:var(--line);pointer-events:none}
.lw{display:flex;flex-direction:column}
.lulu{position:relative;cursor:pointer;flex:1;display:flex;align-items:center;justify-content:center;padding:14px!important;overflow:hidden}
.stage{position:relative;width:min(100%,330px);perspective:800px}
.shd{position:absolute;left:12%;right:12%;bottom:-4px;height:18px;background:radial-gradient(closest-side,rgba(0,0,0,.3),transparent);filter:blur(2px)}
.tilt{transform-style:preserve-3d;transition:transform .18s ease-out;will-change:transform}
.bodyb{position:relative;animation:bob 3.4s ease-in-out infinite;transform-origin:50% 100%}
.bodyb img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.lids{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lid{transform-box:fill-box;transform-origin:center top;transform:scaleY(0);animation:blink 4.8s infinite}
.lbub{position:absolute;top:10px;left:12px;max-width:72%;padding:5px 11px;border-radius:12px;background:rgba(var(--pane),.92);border:1px solid var(--line);color:var(--ink);font-size:13px;opacity:0;transform:translateY(4px);transition:.25s;pointer-events:none;z-index:2}
.lbub.on{opacity:1;transform:none}
.lulu.hop .bodyb{animation:hop .7s ease-out}
@keyframes bob{0%,100%{transform:scale(1,1) rotate(-.8deg)}50%{transform:scale(1.012,.988) rotate(.8deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
@keyframes hop{35%{transform:translateY(-26px) rotate(-3deg)}65%{transform:translateY(0) scale(1.03,.96)}100%{transform:none}}
@media(prefers-reduced-motion:reduce){.lulu *{animation:none!important}.tilt{transition:none}}
/* wallpaper settings */
#wdock{position:fixed;right:20px;bottom:20px;z-index:20;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#wbtn{background:rgba(var(--pane),.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:5px 14px;border-radius:20px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#wp{max-height:82vh;overflow:auto;width:300px;background:rgba(var(--pane),.82)}
#wp[hidden]{display:none}
#wp .wb{display:flex;flex-direction:column;gap:12px;padding:14px 16px;font-size:12px}
#wp label{display:flex;flex-direction:column;gap:4px;color:var(--mute)}
.seg{display:flex;gap:6px}.seg .btn{flex:1;padding:4px 6px}
.wr{display:flex;gap:6px;align-items:center}.wr .btn{flex:1}
.fi{border:1px solid var(--line);background:rgba(var(--pane),.5);color:var(--ink);border-radius:8px;padding:6px 9px;font:inherit;min-width:0;width:100%}
#wp input[type=range]{accent-color:var(--accent)}

/* ---- fit-to-viewport overrides ---- */
.cols{align-items:stretch}
html,body{scrollbar-width:none}
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none}
body{min-height:100vh;display:flex;flex-direction:column}
.cols{flex:1;min-height:780px;margin:16px 24px 20px;grid-template-rows:minmax(0,1fr)}
#bm{display:flex;flex-direction:column;min-height:0}
#bm>.wb{flex:1;min-height:0;overflow:auto}
.rcol{min-height:0;gap:14px}
.rcol>*{flex:none}
.rcol>.duo{flex:1 1 0;min-height:250px;grid-template-rows:minmax(0,1fr);gap:14px}
.two,.three{gap:14px}
.wb{padding:14px 18px}
.tb{height:34px}
.spot{padding:2px 8px 2px 18px}.spot input{padding:9px 10px;font-size:16px}
.px{font-size:clamp(28px,2.6vw,40px)}
.chg b{font-size:19px}
.fr{margin-top:10px;padding:6px 12px}
.fg svg{max-width:150px}.fg .num{font-size:30px}.fg .cls{font-size:15px;margin-top:2px}
.rt .big{font-size:16px}
.rl{font-size:11px;margin-top:2px}
.bar{height:7px;margin-top:4px}
.blk+.blk{margin-top:6px;padding-top:6px}
.row{margin-bottom:6px}
.lt{font-size:28px;margin:2px 0 8px}
.lcol{gap:14px;grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
.eq{min-height:0}
.eq .tb{height:34px}
.eq .wb{padding:8px 16px;overflow:auto}
.eq .cal #dt{font-size:clamp(22px,2.1vw,30px)}
.eq .cal #lunar{font-size:clamp(20px,1.7vw,26px)}
.eq .cal .c2{margin-top:6px;font-size:14px;gap:6px 12px}
.eq .cal .fest,.eq .cal #nxt{font-size:14px}
.eq .cal .fest{padding:0 12px}
.eq .qf{font-size:15px;margin-top:4px}
.quote .wb::before{font-size:70px;top:-6px}
.lw{min-height:0}
.lulu{min-height:0;padding:6px 10px 8px!important}
.lulu.bust{padding-bottom:0!important}
.lulu::before{content:"";position:absolute;inset:8% 12%;background:radial-gradient(closest-side,rgba(255,196,90,.34),transparent);pointer-events:none}
.stage{position:relative;width:auto;height:100%;display:flex;justify-content:center;align-items:flex-end;perspective:800px}
.tilt{height:100%;display:flex;align-items:flex-end}
.bodyb{display:inline-block;height:100%;position:relative}
.bodyb[hidden]{display:none}
.bodyb img{width:auto;height:100%}
.lulu.bust .shd{display:none}
.heart{position:absolute;pointer-events:none;color:#ff6b81;font-size:18px;opacity:0;animation:hf 1.1s ease-out forwards;z-index:3}
@keyframes hf{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-70px) scale(1.2);opacity:0}}
@media(max-width:1000px){.cols{min-height:0}.rcol>.duo{flex:none}.duo{grid-template-rows:auto}.lcol{grid-template-rows:auto}.eq{min-height:130px}.lulu{min-height:340px}}

/* ---- see-through panes, no blur ---- */
:root{--pa:.14}
:root[data-theme="dark"]{--pa:.2}
.win,.menubar{backdrop-filter:none;-webkit-backdrop-filter:none}
.menubar{background:rgba(var(--pane),calc(var(--pa) + .08))}
#wp{background:rgba(var(--pane),.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
:root .win,:root .menubar{text-shadow:0 0 6px rgba(255,255,255,.75),0 0 2px rgba(255,255,255,.6)}
:root[data-theme="dark"] .win,:root[data-theme="dark"] .menubar{text-shadow:0 1px 4px rgba(0,0,0,.65)}
#wp,#wp *,.eq .qt{text-shadow:none}
.eq .qt{filter:drop-shadow(0 0 4px rgba(255,255,255,.8))}
:root[data-theme="dark"] .eq .qt{filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}

/* ---- bigger market windows, compact bottom row ---- */
.px{font-size:clamp(32px,2.9vw,52px)}
.chg b{font-size:clamp(20px,1.7vw,28px)}
.chg small{font-size:13px}
.fr{margin-top:16px;padding:10px 16px}
.fr span{font-size:14px}
.fr b{font-size:22px}
.two .tt{font-size:15px}
.two .badge{width:26px;height:26px;font-size:15px}
.eq .qf{font-size:14px}
@media(min-width:1001px){
 .rcol>.two{flex:1 1 0;min-height:170px;max-height:250px;grid-template-rows:minmax(0,1fr)}
 .two>.win{display:flex;flex-direction:column;min-height:0}
 .two .wb{flex:1;display:flex;flex-direction:column;justify-content:center}
 .rcol>.duo{flex:none;height:200px;min-height:0;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(0,1fr);margin-bottom:24px}
 .lcol{display:contents}
 .eq .cal #dt{font-size:clamp(19px,1.5vw,24px)}
 .eq .cal #lunar{font-size:clamp(18px,1.35vw,22px)}
 .eq .cal .c2{font-size:13px;margin-top:6px}
 .eq .cal .fest,.eq .cal #nxt{font-size:13px}
 .quote .wb::before{font-size:56px}
}
@media(max-width:1000px){.rcol>.duo{height:auto}}

@media(min-width:1001px){.three{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{min-height:720px}}

@media(min-width:1001px){.rcol>.duo{margin-bottom:48px}.cols{min-height:750px}}

/* ---- 噜噜 stands in the free corner, no window ---- */
.pet{position:fixed;right:34px;bottom:14px;width:190px;z-index:12;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
.pet:focus-visible{outline:3px solid var(--accent);outline-offset:6px;border-radius:24px}
.pet svg{display:block;width:100%;height:auto;overflow:visible}
#petBody{transform-origin:120px 270px;animation:pSway 4.8s ease-in-out infinite}
@keyframes pSway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg) translateY(-2px)}}
.pEye{transform-box:fill-box;transform-origin:center;animation:pBlink 5.5s infinite}
@keyframes pBlink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.08)}}
#pArmR{transform-origin:176px 198px}
.pet.wave #pArmR{animation:pWave .5s ease-in-out 3}
@keyframes pWave{0%,100%{transform:rotate(0)}50%{transform:rotate(-55deg)}}
#pMouthOpen{opacity:0;transition:opacity .15s}
.pet.happy #pMouthOpen{opacity:1}
.pet.happy #pMouthFlat{opacity:0}

function festOf(d){
  const l=lunar(d);if(!l.leap&&LUN[l.mn+'-'+l.dn])return LUN[l.mn+'-'+l.dn];
  const n=lunar(new Date(d.getTime()+864e5));if(!n.leap&&n.mn===1&&n.dn===1)return '除夕';
  const y=d.getFullYear(),qm=Math.floor((y%100)*.2422+4.81)-Math.floor((y%100)/4);
  if(d.getMonth()===3&&d.getDate()===qm)return '清明节';

}

}

  const nx=Object.keys(HOL).sort().find(x=>x>k&&HOL[x].isOffDay&&(!h||HOL[x].name!==h.name));
  let nm,days;
  if(nx){nm=HOL[nx].name;days=Math.round((new Date(nx+'T00:00:00')-new Date(k+'T00:00:00'))/864e5)}
  else{nm='元旦';days=Math.round((new Date(d.getFullYear()+1,0,1)-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5)}
  set('nxt','距'+nm+'还有 '+days+' 天');
}

async function J(path,base=OKX){
  const r=await fetch(base+path,{cache:'no-store'});

  if(j && !Array.isArray(j) && j.code!=null && String(j.code)!=='0')

}

async function loadMarketCoin(c,instId,digits){
  const q='?instId='+encodeURIComponent(instId);
  let tickerOK=false,fundingOK=false;
  const results=await Promise.allSettled([
    J('/api/v5/market/ticker'+q),
    J('/api/v5/public/funding-rate'+q),
    J('/api/v5/market/candles'+q+'&bar=1D&limit=2')
  ]);
  // Update price and its receipt timestamp independently from funding/candles.
  if(results[0].status==='fulfilled'&&results[0].value?.[0]){
    const ticker=results[0].value[0],last=Number(ticker.last);
    if(Number.isFinite(last)&&last>0){
      const px=$('px-'+c);px.textContent='$'+fmt(last,digits);
      if(lastPrice[c]!=null&&last!==lastPrice[c])px.style.color=last>lastPrice[c]?'var(--up)':'var(--dn)';
      lastPrice[c]=last;
      quoteReceivedAt[c]=Date.now();quoteReceivedLabel[c]=timeHMS(new Date(quoteReceivedAt[c]));updateQuoteAge(c);tickerOK=true;
    }else console.warn('OKX '+c+' 价格字段无效');
  }else{
    console.warn('OKX '+c+' ticker 请求失败：',results[0].reason);
    const el=$('qt-'+c);if(el&&!quoteReceivedAt[c])el.textContent='行情暂不可用 · 检查网络';
  }
  // UTC daily candle change is independent from the current price request.
  if(results[2].status==='fulfilled'&&results[2].value?.[0]){
    const candles=results[2].value;
    const current=candles.reduce((best,row)=>Number(row[0])>Number(best[0])?row:best,candles[0]);
    const open=Number(current[1]),last=Number($('px-'+c).textContent.replace(/[$,]/g,''));
    if(Number.isFinite(open)&&open>0&&Number.isFinite(last)&&last>0){
      const change=(last/open-1)*100,cg=$('chg-'+c);
      cg.textContent=(change>=0?'+':'')+fmt(change)+'%';cg.className=change>=0?'up':'dn';
    }
  }else console.warn('OKX '+c+' 日K接口暂不可用：',results[2].reason);
  // Funding is independent too; keep last valid values if this request fails.
  if(results[1].status==='fulfilled'&&results[1].value?.[0]){
    const funding=results[1].value[0],fr=Number(funding.fundingRate)*100;
    if(Number.isFinite(fr)){
      const fe=$('fr-'+c);fe.textContent=(fr>=0?'+':'')+fr.toFixed(4)+'%';fe.className=fr>=0?'rd':'gn';fundingOK=true;
    }
    const nt=new Date(Number(funding.nextFundingTime));
    if(Number.isFinite(nt.getTime())&&nt.getTime()>0){nextFundingAt[c]=nt.getTime();updateFundingCountdown(c);}
  }else console.warn('OKX '+c+' 资金费率接口暂不可用：',results[1].reason);
  return {ticker:tickerOK,funding:fundingOK};
}

function fundingCountdownText(target,now=Date.now()){

  text('xr-score',valid?String(score):'—');text('xr-grade',d.health?.grade||'暂无评分');
  const color=valid?(score>=80?'#43d978':score>=60?'#f5b735':'#f05149'):'#777';el('xr-ring').style.setProperty('--ring-color',color);el('xr-ring').style.setProperty('--ring-angle',valid?score*3.6+'deg':'0deg');el('xr-grade').style.color=color;
  text('xr-native',native==='native'?'原生 IP':native==='broadcast'?'广播 IP':'未知');el('xr-native').style.color=native==='native'?'#43d978':'#f5b735';
  text('xr-type',typeNames[type]||'未知');el('xr-type').style.color=type==='isp'?'#43d978':'#f5b735';
  text('xr-bl',hitList?hitList.length?'命中 '+hitList.length:'未命中':d.dnsbl?.supported===false?'不支持':'未知');el('xr-bl').style.color=hitList?.length?'#f05149':hitList?'#43d978':'#999';
  const items=Array.isArray(d.health?.items)?d.health.items:[];text('xr-items',items.map(x=>[x.label,typeof x.pts==='number'?x.pts+' 分':'',x.src].filter(Boolean).join(' · ')).join('； '));
  text('xr-status','来源 ipx.al · 更新 '+new Date().toLocaleTimeString('zh-CN',{hour12:false})+(d.health?.coverage?.low?' · 情报覆盖不足':''));
 }
 async function refresh(){if(busy)return;busy=true;el('xr-refresh').disabled=true;text('xr-status','正在查询 ipx.al…');const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);try{const r=await fetch('https://ipx.al/api/report/self',{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer',signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);paint(await r.json());}catch(e){text('xr-status','查询失败或超时 · 点击刷新重试，已有报告可能过期');}finally{clearTimeout(timer);busy=false;el('xr-refresh').disabled=false;}}
 el('xr-refresh').onclick=refresh;refresh();setInterval(()=>{if(!document.hidden)refresh();},300000);
})();
